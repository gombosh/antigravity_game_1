<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מנהל שומרי הטבע - כלי אבטחה והצפנה מקומי</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #10b981;
            --color-primary-dark: #047857;
            --color-bg-grad: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --color-text-dark: #1f2937;
            --font-kids: 'Varela Round', 'Rubik', sans-serif;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: var(--font-kids);
            background: var(--color-bg-grad);
            color: var(--color-text-dark);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 4px solid var(--color-primary-light);
        }
        h1 {
            color: var(--color-primary-dark);
            margin-bottom: 8px;
            font-size: 2.2rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
            font-size: 1.05rem;
        }
        .section-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: right;
        }
        .section-card h2 {
            font-size: 1.3rem;
            color: var(--color-primary-dark);
            margin-bottom: 16px;
            border-bottom: 2px dashed #cbd5e1;
            padding-bottom: 8px;
        }
        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 700;
            font-size: 0.95rem;
            color: #475569;
        }
        input[type="text"], input[type="password"], textarea {
            font-family: var(--font-kids);
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            transition: all 0.25s;
        }
        input:focus, textarea:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }
        .action-btn {
            font-family: var(--font-kids);
            font-weight: 700;
            font-size: 1.05rem;
            background: var(--color-primary);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
            display: inline-block;
        }
        .action-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
        }
        .result-box {
            margin-top: 16px;
            background: #0f172a;
            color: #38bdf8;
            padding: 16px;
            border-radius: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            word-break: break-all;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
            border: 2px solid #334155;
            max-height: 200px;
            overflow-y: auto;
        }
        .copy-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 8px;
            font-family: var(--font-kids);
        }
        .copy-btn:hover {
            background: #475569;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>מנהל שומרי הטבע - כלי אבטחה</h1>
        <p class="subtitle">כלי מקומי ומאובטח להצפנת משחקים ויצירת קודי משתמשים חדשים באמצעות דפדפן האינטרנט (ללא תלויות שרת).</p>

        <!-- Section 1: Create user credentials -->
        <div class="section-card">
            <h2>🔑 יצירת קוד גישה למשתמש חדש</h2>
            
            <div class="input-group">
                <label>מפתח מאסטר סודי (Master Key):</label>
                <input type="password" id="u-master-key" placeholder="הקלד את מפתח המאסטר של האתר (למשל nature123)">
            </div>
            
            <div class="input-group">
                <label>שם המשתמש החדש (אנגלית/עברית ללא רווחים):</label>
                <input type="text" id="u-username" placeholder="למשל: yossi">
            </div>

            <div class="input-group">
                <label>הסיסמה של המשתמש החדש:</label>
                <input type="text" id="u-password" placeholder="למשל: secret456">
            </div>

            <button class="action-btn" onclick="generateUserCredentials()">צור שורת קוד למשתמש</button>

            <div id="u-result-wrapper" style="display: none;">
                <div class="result-box" id="u-result"></div>
                <button class="copy-btn" onclick="copyText('u-result')">העתק שורת קוד</button>
            </div>
        </div>

        <!-- Section 2: Encrypt Game HTML File -->
        <div class="section-card">
            <h2>📦 הצפנת קובץ HTML של משחק</h2>
            
            <div class="input-group">
                <label>מפתח מאסטר סודי (Master Key):</label>
                <input type="password" id="g-master-key" placeholder="הקלד את מפתח המאסטר של האתר">
            </div>

            <div class="input-group">
                <label>העלה קובץ משחק (HTML):</label>
                <input type="file" id="g-file" accept=".html">
            </div>

            <button class="action-btn" onclick="encryptGameFile()">הצפן קובץ משחק!</button>

            <div id="g-result-wrapper" style="display: none; margin-top: 16px;">
                <label>קוד מוצפן מוכן לשמירה בתיקייה (games/gameX.crypt.txt):</label>
                <div class="result-box" id="g-result" style="max-height: 150px;"></div>
                <button class="action-btn" style="background:#0284c7;" onclick="downloadEncryptedFile()">הורד קובץ מוצפן מוכן! 📥</button>
            </div>
        </div>
    </div>

    <!-- Cryptography implementations using Web Crypto API -->
    <script>
        // Helper: Convert array buffer to Hex string
        function bufferToHex(buffer) {
            return Array.from(new Uint8Array(buffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        // Helper: Convert Hex string to typed Uint8Array
        function hexToBuffer(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return bytes.buffer;
        }

        // Helper: PBKDF2 Password Derivation Key
        async function deriveKeyFromPassword(password, salt) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                "PBKDF2",
                false,
                ["deriveBits", "deriveKey"]
            );
            return await crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        // Action: Generate user credentials
        async function generateUserCredentials() {
            const masterKeyText = document.getElementById('u-master-key').value;
            const username = document.getElementById('u-username').value.trim().toLowerCase();
            const password = document.getElementById('u-password').value.trim();

            if (!masterKeyText || !username || !password) {
                alert('נא למלא את כל השדות!');
                return;
            }

            try {
                const enc = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));

                const derivedKey = await deriveKeyFromPassword(password, salt);

                const encryptedBuffer = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv: iv },
                    derivedKey,
                    enc.encode(masterKeyText)
                );

                const credentials = {
                    salt: bufferToHex(salt),
                    iv: bufferToHex(iv),
                    encryptedKey: bufferToHex(encryptedBuffer)
                };

                const outputCode = `"${username}": ${JSON.stringify(credentials, null, 4)},`;
                
                document.getElementById('u-result').textContent = outputCode;
                document.getElementById('u-result-wrapper').style.display = 'block';
            } catch (err) {
                alert('שגיאה ביצירת משתמש: ' + err.message);
            }
        }

        let encryptedGameTextBlob = '';

        // Action: Encrypt Game File
        async function encryptGameFile() {
            const masterKeyText = document.getElementById('g-master-key').value;
            const fileInput = document.getElementById('g-file');

            if (!masterKeyText || !fileInput.files.length) {
                alert('נא להקליד מפתח מאסטר ולבחור קובץ HTML!');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const rawHTML = e.target.result;
                try {
                    const enc = new TextEncoder();
                    const salt = crypto.getRandomValues(new Uint8Array(16));
                    const iv = crypto.getRandomValues(new Uint8Array(12));

                    // Derive AES-GCM Key directly from master key (using SHA-256 hashing to get 256-bit key)
                    const hashBuffer = await crypto.subtle.digest("SHA-256", enc.encode(masterKeyText));
                    const key = await crypto.subtle.importKey(
                        "raw",
                        hashBuffer,
                        "AES-GCM",
                        false,
                        ["encrypt"]
                    );

                    const encryptedBuffer = await crypto.subtle.encrypt(
                        { name: "AES-GCM", iv: iv },
                        key,
                        enc.encode(rawHTML)
                    );

                    const finalPayload = {
                        salt: bufferToHex(salt),
                        iv: bufferToHex(iv),
                        ciphertext: bufferToHex(encryptedBuffer)
                    };

                    encryptedGameTextBlob = JSON.stringify(finalPayload);
                    
                    document.getElementById('g-result').textContent = encryptedGameTextBlob.substring(0, 500) + '... (סך הכל ' + encryptedGameTextBlob.length + ' תווים מוצפנים)';
                    document.getElementById('g-result-wrapper').style.display = 'block';
                } catch (err) {
                    alert('שגיאה בהצפנת הקובץ: ' + err.message);
                }
            };

            reader.readAsText(file);
        }

        // Action: Download encrypted file
        function downloadEncryptedFile() {
            if (!encryptedGameTextBlob) return;
            const blob = new Blob([encryptedGameTextBlob], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'game1.crypt.txt';
            a.click();
        }

        // Copy helper
        function copyText(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text);
            alert('הקוד הועתק ללוח!');
        }
    </script>
</body>
</html>
